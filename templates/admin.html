<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicNEET Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a1a; }
        .header { background: #2e7d32; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .header button:hover { background: rgba(255,255,255,0.3); }
        .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }

        /* Login */
        .login-box { max-width: 360px; margin: 80px auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .login-box h2 { text-align: center; margin-bottom: 24px; color: #2e7d32; }
        .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 15px; }
        .login-box input:focus { outline: none; border-color: #2e7d32; }
        .login-box .btn { width: 100%; padding: 12px; background: #2e7d32; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-box .btn:hover { background: #1b5e20; }
        .login-error { color: #d32f2f; text-align: center; margin-top: 8px; font-size: 14px; display: none; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 10px; padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .stat-card .num { font-size: 28px; font-weight: 700; color: #2e7d32; }
        .stat-card .label { font-size: 12px; color: #666; margin-top: 4px; }

        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { padding: 8px 20px; border: none; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .tab.active { background: #2e7d32; color: #fff; }

        /* Table */
        .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #666; font-weight: 600; }
        td { padding: 12px 16px; border-top: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #f8fdf8; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-pending { background: #fff3e0; color: #e65100; }
        .badge-completed { background: #e8f5e9; color: #2e7d32; }
        .badge-rejected { background: #ffebee; color: #c62828; }

        /* Buttons */
        .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-approve:hover { background: #1b5e20; }
        .btn-reject { background: #d32f2f; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-left: 6px; }
        .btn-reject:hover { background: #b71c1c; }
        .btn-approve:disabled, .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty { text-align: center; padding: 40px; color: #999; }
        .refresh-btn { background: #fff; border: 1px solid #ddd; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .refresh-btn:hover { background: #f5f5f5; }
        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 999; display: none; }
        .amount { font-weight: 700; color: #2e7d32; }
        .user-id { font-family: monospace; font-size: 12px; color: #888; }

        @media (max-width: 600px) {
            th, td { padding: 8px 10px; font-size: 12px; }
            .btn-approve, .btn-reject { padding: 5px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
{% if not logged_in %}
    <div class="login-box">
        <h2>MedicNEET Admin</h2>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button class="btn" onclick="login()">Login</button>
        <div class="login-error" id="loginError">Invalid username or password</div>
    </div>
    <script>
        document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                if (res.ok) {
                    window.location.reload();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch(e) {
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>
{% else %}
    <div class="header">
        <h1>MedicNEET Admin</h1>
        <button onclick="logout()">Logout</button>
    </div>
    <div class="container">
        <div class="stats" id="stats"></div>

        <div class="actions-bar">
            <div class="tabs">
                <button class="tab active" data-tab="pending" onclick="switchTab('pending')">Pending</button>
                <button class="tab" data-tab="all" onclick="switchTab('all')">Recent</button>
            </div>
            <button class="refresh-btn" onclick="loadData()">Refresh</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Amount</th>
                        <th>UPI</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentTab = 'pending';
        let allData = null;

        async function loadData() {
            try {
                const res = await fetch('/api/withdraw/track');
                allData = await res.json();
                renderStats();
                renderTable();
            } catch(e) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty">Failed to load data</td></tr>';
            }
        }

        function renderStats() {
            if (!allData || !allData.summary) return;
            const s = allData.summary;
            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="num">${s.pending_count}</div><div class="label">Pending</div></div>
                <div class="stat-card"><div class="num">${s.completed_count}</div><div class="label">Completed</div></div>
                <div class="stat-card"><div class="num">\u20b9${s.pending_total_amount}</div><div class="label">Pending Amount</div></div>
            `;
        }

        function renderTable() {
            if (!allData) return;
            const rows = currentTab === 'pending' ? allData.pending_withdrawals : allData.recent_withdrawals;
            const tbody = document.getElementById('tableBody');

            if (!rows || rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty">No withdrawal requests</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map(r => {
                const date = new Date(r.created_at).toLocaleDateString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                const badge = r.status === 'pending' ? 'badge-pending' : r.status === 'completed' ? 'badge-completed' : 'badge-rejected';
                const actions = r.status === 'pending'
                    ? `<button class="btn-approve" onclick="approveRequest(${r.id})">Approve</button><button class="btn-reject" onclick="rejectRequest(${r.id})">Reject</button>`
                    : '-';
                return `<tr>
                    <td>${r.id}</td>
                    <td>${r.user_name || 'Unknown'}<br><span class="user-id">${r.user_id}</span></td>
                    <td class="amount">\u20b9${r.amount}</td>
                    <td style="font-size:12px">${r.upi_id}</td>
                    <td style="font-size:12px">${date}</td>
                    <td><span class="badge ${badge}">${r.status}</span></td>
                    <td>${actions}</td>
                </tr>`;
            }).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            renderTable();
        }

        async function approveRequest(id) {
            if (!confirm('Approve this withdrawal? This will deduct balance from the user.')) return;
            try {
                const res = await fetch('/api/withdraw/approve', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({request_id: id})
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Approved: ' + data.message);
                    loadData();
                } else {
                    showToast('Error: ' + (data.detail || 'Failed'), true);
                }
            } catch(e) {
                showToast('Network error', true);
            }
        }

        async function rejectRequest(id) {
            const reason = prompt('Rejection reason (optional):') || 'Rejected by admin';
            try {
                const res = await fetch('/api/withdraw/reject', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({request_id: id, reason: reason})
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Rejected: ' + data.message);
                    loadData();
                } else {
                    showToast('Error: ' + (data.detail || 'Failed'), true);
                }
            } catch(e) {
                showToast('Network error', true);
            }
        }

        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? '#d32f2f' : '#2e7d32';
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function logout() {
            await fetch('/admin/logout', {method: 'POST'});
            window.location.reload();
        }

        loadData();
    </script>
{% endif %}
</body>
</html>
